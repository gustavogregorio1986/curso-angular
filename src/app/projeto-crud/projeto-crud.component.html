<form [formGroup]="pessoa">
    <input type="text" formControlName="nome" placeholder="Nome" class="form-control"/>
    <input type="number" formControlName="idade" placeholder="Idade" class="form-control"/>
    <input type="text" formControlName="cidade" placeholder="Cidade" class="form-control"/>

    @if(btnCadastrar){
       <input type="button" (click)="cadastrar()" [disabled]="pessoa.invalid" value="cadastrar" class="btn btn-primary"/>
    }@else{
       <input type="button" value="Alterar" class="btn btn-primary"/>
       <input type="button" value="Remover" class="btn btn-primary"/>
       <input type="button" value="Cancelar" class="btn btn-primary"/>
    }

</form>

<table class="table">
   <thead>
       <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Cidade</th>
          <th>Slecionar</th>
       </tr>
   </thead>
   <tbody>
       @for(v of vetor; track $index){
          <tr>
             <td>{{v.nome}}</td>
             <td>{{v.idade}}</td>
             <td>{{v.cidade}}</td>
             <td><button type="button" class="btn btn-primary" (click)="selecionar($index)">Selecionar</button><td>
          </tr>
       }
   </tbody>
</table>
